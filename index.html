<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YASHAURA</title>
<meta name="theme-color" content="#050608">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#050608;color:#e2e8f0;font-family:system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
h1{margin:12px 0 0;font-size:22px;color:#e0f2fe}
.sub{color:#94a3b8;font-size:12px}
.core{height:90px;display:flex;align-items:center;justify-content:center}
.orb{width:64px;height:64px;border-radius:50%;border:3px solid #38bdf8;background:rgba(14,165,233,.2);animation:p 1.8s ease-in-out infinite alternate}
@keyframes p{from{transform:scale(.8)}to{transform:scale(1)}}
.bar{display:flex;gap:8px;margin-bottom:6px}
button{background:#0b1220;color:#38bdf8;border:1px solid #38bdf8;border-radius:10px;padding:10px 12px;font-size:14px}
button.pri{background:#38bdf8;color:#04121c}
#log{flex:1;overflow-y:auto;padding:8px 0}
.m{margin:8px 0;padding:10px 12px;border-radius:12px;max-width:90%;white-space:pre-wrap;line-height:1.4}
.u{background:#0c4a6e;margin-left:auto}
.a{background:#0f172a;border:1px solid #1e293b}
.row{display:flex;gap:8px;padding:8px 0}
input{flex:1;background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:12px;font-size:16px}
dialog{background:#0f172a;color:#e2e8f0;border:1px solid #38bdf8;border-radius:14px;max-width:90%}
#install{display:none}
</style>
</head>
<body>
<div id="app">
  <h1>YASHAURA</h1>
  <div class="sub">CREATED BY YASH · Hindi · Hinglish · English</div>
  <div class="core"><div class="orb"></div></div>
  <div class="bar">
    <button id="install" class="pri">Install App</button>
    <button id="mic">🎤 Bolo</button>
    <button id="clear">Clear</button>
  </div>
  <div id="log"></div>
  <div class="row">
    <input id="q" placeholder="Hindi, Hinglish ya English mein poochho..." autocomplete="off">
    <button id="send" class="pri">Send</button>
  </div>
</div>

<dialog id="dlg">
  <p><b>Confirm WhatsApp</b></p>
  <p id="dlgText"></p>
  <div class="bar"><button id="ok" class="pri">Approve &amp; Open</button><button id="no">Cancel</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), q = $("q");
let history = [];
try { history = JSON.parse(localStorage.getItem("ya_hist") || "[]"); } catch {}

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function save() { try { localStorage.setItem("ya_hist", JSON.stringify(history.slice(-20))); } catch {} }

history.forEach((m) => add(m.text, m.role === "user" ? "u" : "a"));
if (!history.length) add("YASHAURA ready. I was created by Yash.", "a");

async function send(text) {
  text = text.trim(); if (!text) return;
  add(text, "u");
  // Consent gate for external actions
  if (/^whatsapp\s/i.test(text)) {
    const body = text.replace(/^whatsapp\s+/i, "");
    $("dlgText").textContent = "Message: " + body;
    $("dlg").showModal();
    $("ok").onclick = () => { $("dlg").close(); window.open("https://wa.me/?text=" + encodeURIComponent(body), "_blank"); };
    $("no").onclick = () => $("dlg").close();
    add("WhatsApp draft ready. Confirm karein.", "a");
    return;
  }
  if (!navigator.onLine) { add("Offline mode: internet on karke dobara try karein.", "a"); return; }
  const thinking = document.createElement("div"); thinking.className = "m a"; thinking.textContent = "…";
  log.appendChild(thinking);
  try {
    const r = await fetch("/api/orchestrate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history })
    });
    const d = await r.json();
    thinking.textContent = d.reply || "Done.";
    history.push({ role: "user", text }, { role: "model", text: d.reply || "" });
    save();
    speak(d.reply);
  } catch { thinking.textContent = "Network error. Dobara try karein."; }
}

$("send").onclick = () => { const t = q.value; q.value = ""; send(t); };
q.addEventListener("keydown", (e) => { if (e.key === "Enter") $("send").click(); });
$("clear").onclick = () => { history = []; save(); log.innerHTML = ""; add("History cleared.", "a"); };

// Voice input (Chrome on Android supports this; needs mic permission, tap-to-talk only)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $("mic").style.display = "none";
else $("mic").onclick = () => {
  const rec = new SR(); rec.lang = "hi-IN"; rec.interimResults = false;
  rec.onresult = (e) => send(e.results[0][0].transcript);
  rec.start();
};
function speak(t) {
  if (!t || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(t.slice(0, 300)); u.lang = "hi-IN";
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

// PWA install
let deferred;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; $("install").style.display = "inline-block"; });
$("install").onclick = async () => { if (deferred) { deferred.prompt(); deferred = null; $("install").style.display = "none"; } };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
